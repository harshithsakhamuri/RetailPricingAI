name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: "Also download the UCI dataset and re-run the full pipeline"
        type: boolean
        default: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit, parity and output-invariant tests
        run: pytest -q

  full-pipeline:
    if: github.event_name == 'workflow_dispatch' && inputs.full_pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Download dataset
        run: |
          curl -fsSL -o retail.zip https://archive.ics.uci.edu/static/public/352/online+retail.zip
          unzip -o retail.zip -d data
      - run: python src/pricing_profit_optimizer.py
      - run: python src/export_web_data.py
      - name: Re-check every invariant on the fresh outputs
        run: pytest -q
